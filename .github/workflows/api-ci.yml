name: API CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run API tests
        env:
          RETAILSENSE_MODELS_DIR: ./models
          RETAILSENSE_MODEL_REGISTRY_PATH: ./models/model_registry.json
          RETAILSENSE_REQUEST_LOG_ENABLED: "false"
        run: pytest tests/test_api.py -q
